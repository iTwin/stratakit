packages:
  - packages/*
  - apps/*
  - internal
  - examples

catalog:
  "@mui/material": ^9.2.0
  "@mui/utils": ^9.2.0
  "@mui/x-date-pickers": ^9.10.1
  "@playwright/test": ~1.62.0
  "@types/node": ^22.19.19
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  esbuild: ^0.28.1
  lightningcss: ^1.33.0
  react: ^19.2.8
  react-dom: ^19.2.8
  typescript: ~6.0.3

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "@stratakit/*"
  - "@itwin/*"
  - "@mui/*"
  - react
  - react-dom

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - sharp

overrides:
  brace-expansion@<5.0.0: ^5.0.6
  lightningcss: 1.30.1

patchedDependencies:
  lightningcss: patches/lightningcss.patch
  wireit: patches/wireit.patch
