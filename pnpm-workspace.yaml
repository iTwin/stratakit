packages:
  - packages/*
  - apps/*
  - internal
  - examples

catalog:
  "@mui/material": ^9.0.1
  "@mui/utils": ^9.0.1
  "@mui/x-date-pickers": ^9.6.0
  "@playwright/test": ~1.60.0
  "@types/node": ^22.19.19
  "@types/react": ^19.2.16
  "@types/react-dom": ^19.2.3
  esbuild: ^0.28.0
  lightningcss: ^1.32.0
  react: ^19.2.7
  react-dom: ^19.2.7
  typescript: ~6.0.3

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "@stratakit/*"
  - "@itwin/*"
  - "@mui/*"
  - react
  - react-dom

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - sharp

overrides:
  brace-expansion@<5.0.0: ^5.0.6
  lightningcss: 1.30.1

patchedDependencies:
  lightningcss: patches/lightningcss.patch
  wireit: patches/wireit.patch
