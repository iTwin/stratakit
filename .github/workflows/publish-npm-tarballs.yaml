name: Publish tarballs to npm

on:
  workflow_call:
    inputs:
      tag:
        description: "Which npm dist tag to publish to"
        required: true
        type: string
    secrets:
      NPMJS_PUBLISH_ITWIN:
        required: true

jobs:
  # This job has access to the npm token, so it must not check out the repo or install deps.
  # It will publish the `npm-tarballs` artifact uploaded by an earlier job in the same workflow run.
  publish:
    name: Publish package tarballs
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write # for npm provenance

    steps:
      - name: Download package tarballs
        uses: actions/download-artifact@v8
        with:
          name: npm-tarballs
          path: release

      - name: Use Node 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/

      - name: Publish package tarballs
        working-directory: release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMJS_PUBLISH_ITWIN }}
        run: |
          for tarball in *.tgz; do
            npm publish "./$tarball" --provenance --access public --tag ${{ inputs.tag }}
          done
