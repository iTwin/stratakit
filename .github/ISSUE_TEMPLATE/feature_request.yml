name: Feature request ✨
description: Suggest a new component, pattern, or enhancement for the design system
type: enhancement
assignees: []
body:
  - type: textarea
    attributes:
      label: Problem or use case
      description: |
        What problem does this feature solve? What use case does it address? 
        Help us understand the context and need for this feature.
      placeholder: "As a developer/designer, I need…"
    validations:
      required: false
  - type: textarea
    attributes:
      label: Proposed solution
      description: |
        Describe your ideal solution. What should this feature look like and how should it behave?
        Include any specific requirements or constraints.
      placeholder: "I would like to see…"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Examples and mockups
      description: |
        Provide visual examples, mockups, or references to similar implementations.
        You can attach images by dragging & dropping, selecting, or pasting them.
      placeholder: "Here are some examples of what I'm looking for…"
    validations:
      required: false
  - type: textarea
    attributes:
      label: Alternative solutions
      description: |
        Have you considered any alternative approaches or workarounds?
        What other solutions have you explored?
      placeholder: "I've also considered…"
    validations:
      required: false
  - type: textarea
    attributes:
      label: Additional context
      description: |
        Add any other context, screenshots, or details that might be helpful.
        Include information about target platforms, accessibility considerations, etc.
    validations:
      required: false
