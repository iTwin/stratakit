packages:
  - packages/*
  - apps/*
  - internal
  - examples

catalog:
  "@mui/material": ^9.0.1
  "@mui/utils": ^9.0.1
  "@mui/x-date-pickers": ^9.6.0
  "@playwright/test": ~1.62.1
  "@types/node": ^22.19.19
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  esbuild: ^0.28.1
  lightningcss: ^1.33.0
  react: ^19.2.8
  react-dom: ^19.2.8
  typescript: ~7.0.2

minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - "@stratakit/*"
  - "@itwin/*"
  - "@mui/*"
  - react
  - react-dom

allowBuilds:
  core-js-pure: false
  esbuild: true
  lefthook: true
  sharp: true

overrides:
  lightningcss: 1.30.1

patchedDependencies:
  lightningcss: patches/lightningcss.patch

shellEmulator: true
linkWorkspacePackages: true
