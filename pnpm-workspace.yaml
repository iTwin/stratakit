packages:
  - packages/*
  - apps/*
  - internal
  - examples

catalog:
  "@mui/material": ^9.5.0
  "@mui/utils": ^9.5.0
  "@mui/x-data-grid": ^9.15.0
  "@mui/x-date-pickers": ^9.15.0
  "@playwright/test": ~1.64.0
  "@types/node": ^22.19.19
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  esbuild: ^0.28.2
  lightningcss: ^1.33.0
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ~7.0.2

minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - "@stratakit/*"
  - "@itwin/*"
  - "@mui/*"
  - react
  - react-dom

allowBuilds:
  core-js-pure: false
  esbuild: true
  lefthook: true
  sharp: true

shellEmulator: true
linkWorkspacePackages: true
