name: CD

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    if: github.repository == 'iTwin/stratakit'
    runs-on: ubuntu-latest
    permissions:
      contents: write # for pushing commits/tags
      pull-requests: write # for creating PRs
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      has-packages: ${{ steps.upload.outputs.artifact-id != '' }}
      npm-tag: ${{ steps.npm-tag.outputs.tag }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
        # with:
        #   token: ${{ secrets.IMJS_ADMIN_GH_TOKEN }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.18.0

      - name: Use Node 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "pnpm"

      - run: pnpm install

      - name: Create release PR or pack and tag packages
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run changeset:version
          publish-script: pnpm run changeset:release
          pr-title: Release packages
          commit-message: Release packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com

      - name: Upload package tarballs
        id: upload
        if: hashFiles('dist/release/packages/*.tgz') != ''
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarballs
          path: dist/release/packages/*.tgz

      - name: Determine npm dist tag
        id: npm-tag
        # reads the `tag` from .changeset/pre.json or defaults to 'latest'
        run: echo "tag=$(jq -r .tag .changeset/pre.json 2>/dev/null || echo latest)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to npm
    needs: release
    if: needs.release.outputs.has-packages == 'true'
    permissions:
      id-token: write # for npm provenance
    uses: "./.github/workflows/publish-npm-tarballs.yaml"
    with:
      tag: ${{ needs.release.outputs.npm-tag }}
    secrets:
      NPMJS_PUBLISH_ITWIN: ${{ secrets.NPMJS_PUBLISH_ITWIN }}

  deploy-docs:
    name: Deploy released docs
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write # for pushing to gh-pages
    uses: "./.github/workflows/deploy-gh-pages.yaml"
